# ==============================================================================
# En-têtes de sécurité HTTP — fragment inclus
# ==============================================================================
# POURQUOI UN FICHIER SÉPARÉ ET INCLUS PLUSIEURS FOIS ?
#
# nginx applique une règle d'héritage contre-intuitive : les directives
# `add_header` d'un niveau ne sont héritées par un bloc `location` QUE SI ce
# bloc ne déclare lui-même AUCUN `add_header`. Dès qu'un `location` en déclare
# un seul (par exemple Cache-Control), TOUS les en-têtes du bloc `server`
# parent sont silencieusement abandonnés pour ce location.
#
# C'est un piège classique, et il nous a réellement touchés : le test de fumée
# (scripts/smoke-test.sh) a détecté que GET / ne renvoyait aucun en-tête de
# sécurité, car `try_files` y provoque une redirection interne vers
# `location = /index.html`, lequel définit Cache-Control.
#
# La parade est d'externaliser les en-têtes ici et de les `include` dans
# CHAQUE location qui déclare un `add_header`. Source de vérité unique,
# aucune duplication, et le test de fumée garantit la non-régression.
# ==============================================================================

# Menace : XSS (injection de script). Déclare les seules origines autorisées à
# fournir du code exécutable. L'application ne comporte aucun script inline ni
# handler onclick : `script-src 'self'` suffit, SANS 'unsafe-inline'.
# Les 7 attributs style="width:NN%" ont été externalisés en classes CSS (.pct-*)
# afin de pouvoir également omettre 'unsafe-inline' sur style-src.
#
# DETTE CONNUE : fonts.googleapis.com / fonts.gstatic.com restent autorisés.
# Auto-héberger les polices durcirait la CSP et supprimerait un transfert
# d'adresse IP vers un tiers hors UE (enjeu RGPD). Suivi en backlog.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Menace : MIME sniffing. Empêche le navigateur de réinterpréter un fichier
# comme du script exécutable en devinant son type.
add_header X-Content-Type-Options "nosniff" always;

# Menace : clickjacking. Interdit l'inclusion du site dans une iframe tierce
# qui superposerait une interface piégée par-dessus la vraie.
add_header X-Frame-Options "DENY" always;

# Menace : fuite de données via l'en-tête Referer, qui transmettrait l'URL
# consultée (potentiellement porteuse d'identifiants) à des sites tiers.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Menace : accès abusif aux capteurs et API du navigateur. Neutralise des
# fonctionnalités que l'application n'utilise pas, réduisant la surface
# exploitable en cas de compromission.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Menace : rétrogradation SSL / interception (MITM). Force le navigateur à
# n'utiliser que HTTPS pendant un an.
# NOTE : sans effet en HTTP local ; l'en-tête n'est honoré qu'en HTTPS. En
# production, la terminaison TLS est assurée par le reverse proxy amont.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
