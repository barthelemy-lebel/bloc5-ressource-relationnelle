# ==============================================================================
# (RE)Sources Relationnelles — Configuration nginx du conteneur applicatif
# ==============================================================================
# Ce fichier et son fragment security-headers.conf portent l'essentiel des
# mesures de sécurité applicables côté serveur web. Ils servent de preuve
# directe pour le plan de sécurisation (docs/01-plan-securisation.md), et le
# test de fumée (scripts/smoke-test.sh) vérifie automatiquement leur effet.
#
# NOTE : l'image de base est nginxinc/nginx-unprivileged, qui s'exécute sous
# l'utilisateur non-privilégié uid 101 et écoute sur le port 8080 (et non 80,
# car les ports < 1024 exigent des privilèges root).
# ==============================================================================

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --------------------------------------------------------------------------
    # Divulgation d'informations
    # --------------------------------------------------------------------------
    # Menace : la bannière « nginx/1.30.4 » renseigne un attaquant sur la version
    # exacte du serveur, lui permettant de cibler des CVE connues (reconnaissance).
    server_tokens off;

    # --------------------------------------------------------------------------
    # En-têtes de sécurité (niveau serveur)
    # --------------------------------------------------------------------------
    # ⚠ Cet include DOIT être répété dans chaque `location` déclarant un
    # `add_header`, faute de quoi nginx abandonne ces en-têtes pour ce location.
    # Explication détaillée dans security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # --------------------------------------------------------------------------
    # Performance
    # --------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # --------------------------------------------------------------------------
    # Sonde de vivacité (health check)
    # --------------------------------------------------------------------------
    # Utilisée par le HEALTHCHECK Docker, par docker-compose et par les tests de
    # fumée. Sans journalisation, pour ne pas polluer les logs applicatifs.
    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --------------------------------------------------------------------------
    # Politique de cache
    # --------------------------------------------------------------------------
    # Le HTML n'est jamais mis en cache : c'est lui qui référence les assets, il
    # doit donc toujours refléter la version déployée.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Les assets ne sont pas versionnés par empreinte dans leur nom de fichier :
    # on limite le cache à 1 heure avec revalidation, pour éviter qu'un ancien
    # app.js persiste chez les visiteurs après un déploiement.
    location ~* \.(css|js|svg|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Le fichier de version ne doit jamais être mis en cache : il sert à
    # vérifier quelle version tourne réellement après un déploiement.
    location = /build-info.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # --------------------------------------------------------------------------
    # Routage
    # --------------------------------------------------------------------------
    # L'application est une SPA : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Menace : divulgation d'informations via les fichiers cachés. Bloque
    # l'accès à d'éventuels .git, .env ou .htaccess laissés dans la racine web.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
